spring:
  application:
    name: payments-service
  profiles:
    active: dev
  # Fase 2: la persistencia de idempotencia usa Spring Data JPA con el driver JDBC de
  # PostgreSQL (decisión de diseño D1, opción de respaldo sobre boundedElastic). La
  # configuración previa referenciaba spring.r2dbc, incoherente con el starter JPA del
  # pom.xml (sin starter R2DBC), lo que impedía construir el EntityManagerFactory y
  # arrancar el contexto. Se migra a spring.datasource.* (JDBC) para que sea coherente.
  datasource:
    url: jdbc:postgresql://localhost:5432/payments_db
    username: payments_user
    password: payments_pass
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: payments-hikari-pool
      minimum-idle: 10
      maximum-pool-size: 20
      idle-timeout: 1800000
      connection-test-query: SELECT 1
  jpa:
    hibernate:
      # El esquema lo crea schema.sql (Req 1.1, 5.3), no Hibernate; validate comprueba
      # que el mapeo de la entidad coincide con la tabla ya creada.
      ddl-auto: validate
    show-sql: true
    # El esquema (schema.sql) se ejecuta antes de que Hibernate valide el mapeo.
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
  # Ejecuta schema.sql en el arranque para crear la tabla idempotency_record y su índice
  # (Req 1.1, 5.3, 6.3). El script es idempotente (IF NOT EXISTS).
  sql:
    init:
      mode: always

payments:
  idempotency:
    # Periodo de vida (TTL) de un Idempotency_Record antes de ser elegible para
    # eliminación. Duration ISO-8601 (Requirements 6.1, 6.2).
    ttl: PT24H
    cleanup:
      # Periodicidad del Cleanup_Process que elimina los records expirados.
      # Duration ISO-8601 (Requirement 6.2).
      fixed-delay: PT1H

server:
  port: 8080
  shutdown: graceful
  netty:
    connection-timeout: 2s
    idle-timeout: 15s

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        minimumNumberOfCalls: 5
        eventConsumerBufferSize: 10
    instances:
      coreBankingService:
        baseConfig: default
        failureRateThreshold: 60
        waitDurationInOpenState: 10s
      fraudDetectionService:
        baseConfig: default
        failureRateThreshold: 40
        waitDurationInOpenState: 8s
      riskBureauService:
        baseConfig: default
        failureRateThreshold: 50
        waitDurationInOpenState: 12s
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - org.springframework.web.reactive.function.client.WebClientResponseException$InternalServerError
          - java.util.concurrent.TimeoutException
          - java.io.IOException
    instances:
      coreBankingService:
        baseConfig: default
      fraudDetectionService:
        baseConfig: default
      riskBureauService:
        baseConfig: default
  bulkhead:
    configs:
      default:
        maxConcurrentCalls: 25
        maxWaitDuration: 0
    instances:
      coreBankingService:
        baseConfig: default
      fraudDetectionService:
        baseConfig: default
      riskBureauService:
        baseConfig: default

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    com.pragma.payments: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true
    ratelimiters:
      enabled: true
    # Health indicator del bulkhead: expone el estado de la concurrencia por servicio
    # (llamadas disponibles/en uso) en /actuator/health (Requirements 6.3, 6.4).
    bulkheads:
      enabled: true
  metrics:
    enable:
      resilience4j: true