spring:
  application:
    name: payments-service
  profiles:
    active: dev
  # Fase 2: la persistencia de idempotencia usa Spring Data JPA con el driver JDBC de
  # PostgreSQL (decisión de diseño D1, opción de respaldo sobre boundedElastic). La
  # configuración previa referenciaba spring.r2dbc, incoherente con el starter JPA del
  # pom.xml (sin starter R2DBC), lo que impedía construir el EntityManagerFactory y
  # arrancar el contexto. Se migra a spring.datasource.* (JDBC) para que sea coherente.
  datasource:
    url: jdbc:postgresql://localhost:5432/payments_db
    username: payments_user
    password: payments_pass
    driver-class-name: org.postgresql.Driver
    # Fase 3 (D5, H8): dimensionamiento explícito del pool HikariCP. El pool es el
    # cuello de botella de recursos: cada operacion de idempotencia (find/reserve/
    # complete/delete) toma una conexion via un hilo de boundedElastic. Se fijan todos
    # los parametros para evitar agotamiento silencioso y recortar conexiones zombie.
    # Invariante: minimum-idle (10) <= maximum-pool-size (20); todos los valores > 0.
    # Requirements 6.1, 6.3.
    hikari:
      pool-name: payments-hikari-pool
      # Tamano maximo del pool. Acota el numero de conexiones activas concurrentes y, a
      # su vez, el numero util de hilos de boundedElastic que pueden pedir conexion (D5).
      maximum-pool-size: 20
      # Minimo de conexiones ociosas mantenidas listas. <= maximum-pool-size (invariante).
      minimum-idle: 10
      # ms: si no hay conexion libre en este intervalo, la solicitud falla con error de
      # agotamiento del pool (fallar rapido, sin bloquear mas alla del timeout). Req 6.3.
      connection-timeout: 3000
      # ms: vida maxima de una conexion antes de ser reciclada (< tiempo de corte de la BD).
      max-lifetime: 1800000
      # ms: tiempo que una conexion puede permanecer ociosa antes de ser retirada
      # (solo por encima de minimum-idle).
      idle-timeout: 600000
      # Consulta ligera de validacion de conexiones.
      connection-test-query: SELECT 1
  jpa:
    hibernate:
      # El esquema lo crea schema.sql (Req 1.1, 5.3), no Hibernate; validate comprueba
      # que el mapeo de la entidad coincide con la tabla ya creada.
      ddl-auto: validate
    show-sql: true
    # El esquema (schema.sql) se ejecuta antes de que Hibernate valide el mapeo.
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
  # Ejecuta schema.sql en el arranque para crear la tabla idempotency_record y su índice
  # (Req 1.1, 5.3, 6.3). El script es idempotente (IF NOT EXISTS).
  sql:
    init:
      mode: always

payments:
  idempotency:
    # Periodo de vida (TTL) de un Idempotency_Record antes de ser elegible para
    # eliminación. Duration ISO-8601 (Requirements 6.1, 6.2).
    ttl: PT24H
    cleanup:
      # Periodicidad del Cleanup_Process que elimina los records expirados.
      # Duration ISO-8601 (Requirement 6.2).
      fixed-delay: PT1H
    # Fase 3 (D3, H6): caché de lectura de idempotencia. Solo cachea registros COMPLETED
    # (inmutables) para evitar reconsultar la BD ante duplicados y consultas repetidas.
    # El TTL de la caché debe ser <= payments.idempotency.ttl (Requirement 4.6); si lo
    # supera, CacheConfig lo acota al TTL de idempotencia de forma defensiva.
    cache:
      maximum-size: 10000
      ttl: PT1H

# Fase 3 (D2, H1, H9): timeouts coherentes y externalizados por servicio externo.
# Se enlazan a ExternalTimeoutProperties (campos Duration fraud/risk/core). Cada valor
# se expresa como un entero en milisegundos; Spring Boot enlaza un entero sin unidad a
# Duration como milisegundos. El timeout de riesgo (2500ms) es estrictamente > 2000ms,
# cumpliendo el requisito del reto (Requirements 1.1, 1.2, 1.3).
external:
  services:
    timeouts:
      fraud: 1000
      risk: 2500
      core: 1000

server:
  port: 8080
  shutdown: graceful
  netty:
    connection-timeout: 2s
    idle-timeout: 15s

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        minimumNumberOfCalls: 5
        eventConsumerBufferSize: 10
    instances:
      coreBankingService:
        baseConfig: default
        failureRateThreshold: 60
        waitDurationInOpenState: 10s
      fraudDetectionService:
        baseConfig: default
        failureRateThreshold: 40
        waitDurationInOpenState: 8s
      riskBureauService:
        baseConfig: default
        failureRateThreshold: 50
        waitDurationInOpenState: 12s
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - org.springframework.web.reactive.function.client.WebClientResponseException$InternalServerError
          - java.util.concurrent.TimeoutException
          - java.io.IOException
    instances:
      coreBankingService:
        baseConfig: default
      fraudDetectionService:
        baseConfig: default
      riskBureauService:
        baseConfig: default
  bulkhead:
    configs:
      default:
        maxConcurrentCalls: 25
        maxWaitDuration: 0
    instances:
      coreBankingService:
        baseConfig: default
      fraudDetectionService:
        baseConfig: default
      riskBureauService:
        baseConfig: default

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    com.pragma.payments: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true
    ratelimiters:
      enabled: true
    # Health indicator del bulkhead: expone el estado de la concurrencia por servicio
    # (llamadas disponibles/en uso) en /actuator/health (Requirements 6.3, 6.4).
    bulkheads:
      enabled: true
  metrics:
    enable:
      resilience4j: true